---
# Source: logging-operator-config/templates/flow.yaml
apiVersion: logging.banzaicloud.io/v1beta1
kind: Flow
metadata:
  name: cloudwatch-flow-logs
  namespace: datajar-django-sbox
  labels: 
    app.kubernetes.io/name: logging-operator-config
    app.kubernetes.io/instance: logging-operator-config
spec:
  filters:
    - tag_normaliser: {}
  match:
    - select:
        labels:
          app.kubernetes.io/type: datajar
  localOutputRefs:
    - cloudwatch-output-sink
---
# Source: logging-operator-config/templates/output.yaml
apiVersion: logging.banzaicloud.io/v1beta1
kind: Output
metadata:
  name: cloudwatch-output-sink
  namespace: datajar-django-sbox
  labels: 
    app.kubernetes.io/name: logging-operator-config
    app.kubernetes.io/instance: logging-operator-config
spec:
  cloudwatch:
    log_group_name: /aws/eks/euw2-datajar-sbox231206/datajar-django-sbox
    log_stream_name: ${tag}
    region: eu-west-2
    auto_create_stream: true
    buffer:
      timekey: 30s
      timekey_wait: 30s
      timekey_use_utc: true
