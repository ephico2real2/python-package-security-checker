namespace: datajar-django-stage
nameOverride: ""
environmentName: stage
region: us-east-1
targetClusterName: use1-jprosvc-stage240110

flow:
  baseName: flow
  labels:
    app.kubernetes.io/type: datajar

cloudwatch:
  enabled: true
  output:
    name: cloudwatch-output
    log_stream_name: "${tag}"
    auto_create_stream: true
    buffer:
      timekey: 30s
      timekey_wait: 30s
      timekey_use_utc: true

splunk:
  enabled: true
  hecTokenSecretName: splunk-hec-token
  secretStore: aws-secrets-manager
  refreshInterval: "30m"
  output:
    name: splunk-output
    hec_host: http-inputs-jamf.splunkcloud.com
    insecure_ssl: false
    hec_port: 443
    index: cloud_stage_datajar_application
    format_type: json